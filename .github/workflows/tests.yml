name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  FORCE_COLOR: 1

jobs:
  test:
    name: "Python ${{ matrix.python-version }}, Django ${{ matrix.django-version}}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        django-version: ["5.2", "6.0", "6.1", "main"]
        exclude:
          - python-version: "3.10"
            django-version: "6.0"
          - python-version: "3.10"
            django-version: "6.1"
          - python-version: "3.11"
            django-version: "6.0"
          - python-version: "3.11"
            django-version: "6.1"

    steps:
      - name: Git clone
        uses: actions/checkout@v7

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Get pip cache dir
        id: pip-cache
        run: echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT

      - name: Set up pip cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: ${{ matrix.python-version }}-v2-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ matrix.python-version }}-v2-

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade tox tox-gh-actions

      - name: Test with Tox
        run: tox --verbose --parallel auto
        env:
          DJANGO: ${{ matrix.django-version }}

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          flags: ${{ matrix.python-version }}
          name: Python ${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}

  ruff:
    name: Run ruff
    runs-on: ubuntu-latest

    strategy:
      matrix:
        toxenv:
          - ruff

    steps:
      - name: Git clone
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Get pip cache dir
        id: pip-cache
        run: echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT

      - name: Set up pip cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: ${{ matrix.python-version }}-v2-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ matrix.python-version }}-v2-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade tox tox-gh-actions

      - name: Run ruff
        run: python -m tox -e ruff

  slack:
    if: always()  # Pick up events even if the job fails or is cancelled.
    runs-on: ubuntu-latest
    needs:
      - test
      - ruff

    steps:
      - name: Slack notification
        uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.ACTIONS_CI_SLACK_HOOK }}
          webhook-type: incoming-webhook
          payload: |
            text: "*Result: ${{ job.status }}\n${{ github.event.pull_request.html_url || github.event.head_commit.url }}*"
            blocks:
              # Name of workflow
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: |
                    *Workflow:* ${{ github.workflow }}
              # Did the 2 jobs succeed?
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: |
                    *${{ needs.test.result == 'success' && needs.ruff.result == 'success'
                      && '✅ Every job succeeded' || '❌ One or more jobs failed' }}*

                    ${{ needs.test.result == 'success' && '✅' || '❌' }} Tests
                    ${{ needs.ruff.result == 'success' && '✅' || '❌' }} Ruff
              # Outputs links to the PR, or Commit, if any.
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: |
                    *${{
                      github.event.pull_request.html_url && 'PR'
                      || github.event.head_commit.url && 'Commit'
                      || 'Source'
                    }}:* ${{
                      github.event.pull_request.html_url &&
                        format('<{0}|#{1}>', github.event.pull_request.html_url, github.event.pull_request.number)
                      || github.event.head_commit.url &&
                          format('<{0}|{1}>', github.event.head_commit.url, github.event.head_commit.id)
                      || 'none'
                    }}
                    *Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.run_id }}>
